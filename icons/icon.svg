<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1c0b0a"/>
      <stop offset="1" stop-color="#0b0706"/>
    </radialGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a1c1c"/>
      <stop offset="0.55" stop-color="#4a1212"/>
      <stop offset="1" stop-color="#2a0909"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6df96"/>
      <stop offset="0.5" stop-color="#b8892e"/>
      <stop offset="1" stop-color="#6e4e16"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256)">
    <!-- spine edge -->
    <rect x="-132" y="-158" width="20" height="316" rx="6" fill="#1a0505"/>
    <!-- cover -->
    <rect x="-120" y="-160" width="240" height="320" rx="14" fill="url(#leather)"/>
    <!-- gold border -->
    <rect x="-100" y="-140" width="200" height="280" rx="8" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <rect x="-92" y="-132" width="184" height="264" rx="5" fill="none" stroke="#b8892e" stroke-width="1.5" opacity="0.7"/>
    <!-- corner studs -->
    <circle cx="-84" cy="-116" r="5" fill="url(#gold)"/>
    <circle cx="84" cy="-116" r="5" fill="url(#gold)"/>
    <circle cx="-84" cy="116" r="5" fill="url(#gold)"/>
    <circle cx="84" cy="116" r="5" fill="url(#gold)"/>
    <!-- keyhole -->
    <circle cx="0" cy="-20" r="26" fill="url(#gold)"/>
    <path d="M-11 0 L11 0 L20 70 L-20 70 Z" fill="url(#gold)"/>
  </g>
</svg>
