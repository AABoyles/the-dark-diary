<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A leather-bound diary that answers back. Private, offline, and entirely in your browser.">
<title>The Dark Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a0d0d">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/hand.css">
<link rel="stylesheet" href="css/effects.css">
<link rel="stylesheet" href="css/atmosphere.css">
</head>
<body>
<main id="desk">
  <h1 class="sr-only">The Dark Diary</h1>
  <!-- CLOSED BOOK: click to open -->
  <section id="book" class="closed" aria-label="The diary">
    <div id="cover" role="button" tabindex="0" aria-describedby="cover-hint">
      <div class="cover-emboss">
        <span class="cover-line">Property of</span>
        <span class="cover-title">The Diary</span>
        <span class="cover-line">of nobody in particular</span>
      </div>
      <span id="cover-hint" class="cover-hint">Touch the cover to open it</span>
    </div>

    <!-- OPEN BOOK -->
    <div id="pages">
      <!-- Left page: the inside cover (endpaper) while browsing the contents;
           plain parchment while reading an entry -->
      <div class="page page-left" id="left-page" aria-hidden="true">
        <div class="bookplate"><span>Ex Libris</span><span class="bookplate-sub">nobody in particular</span></div>
      </div>

      <!-- Right page: table of contents -->
      <div class="page page-right" id="toc-page">
        <h2 class="toc-heading">Contents</h2>
        <ol id="toc-list"></ol>
        <!-- The diary asks before it downloads a language model (issues #6, #25) -->
        <section id="mind-slip" hidden aria-labelledby="mind-note">
          <p id="mind-note"></p>
          <div id="mind-options" role="group" aria-label="Choose the diary's mind"></div>
        </section>
        <button id="new-session" type="button">Write a new entry…</button>
        <div id="engine-status" aria-live="polite"></div>
        <button id="mind-control" type="button" hidden></button>
        <div id="page-settings" role="group" aria-label="Page settings">
          <button id="sound-toggle" class="setting" type="button" aria-pressed="false"><span aria-hidden="true">♪ </span>Sound<span class="state" aria-hidden="true">: off</span></button>
          <button id="candle-toggle" class="setting" type="button" aria-pressed="true">Candle<span class="state" aria-hidden="true">: lit</span></button>
          <button id="plain-toggle" class="setting" type="button" aria-pressed="false">Plain ink<span class="state" aria-hidden="true">: off</span></button>
        </div>
      </div>

      <!-- Entry view: text flows through CSS columns, one column per page.
           An entry always begins on a right-hand page. -->
      <div id="flow-view" hidden>
        <div id="flow-viewport">
          <div id="flow">
            <div id="leaf-spacer" aria-hidden="true"></div>
            <header id="session-header">
              <h2 id="session-title"></h2>
              <time id="session-date"></time>
            </header>
            <div id="entries" aria-live="polite"></div>
            <form id="entry-form" autocomplete="off">
              <textarea id="entry-input" rows="1" maxlength="2000" placeholder="Write something…" aria-label="Write in the diary"></textarea>
            </form>
          </div>
        </div>
        <button id="back-to-toc" type="button" aria-label="Back to contents">⟵ Contents</button>
        <nav id="spread-nav" aria-label="Turn pages">
          <button id="prev-spread" type="button" aria-label="Previous pages"><span aria-hidden="true">‹</span></button>
          <span id="spread-label"></span>
          <button id="next-spread" type="button" aria-label="Next pages"><span aria-hidden="true">›</span></button>
        </nav>
        <button id="delete-session" type="button" title="Burn this entry">Burn entry</button>
      </div>
    </div>
  </section>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
